name: Bible Diaries marketing website
on:
  pull_request:
    paths: ['web/**', '.github/workflows/marketing-web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/marketing-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SITE_URL: https://bible-diaries.example
      - run: npm run test:site
      - run: npm audit --audit-level=high
