name: App security and Docker
on:
  push:
    branches: [main]
    paths: ['src/**', 'shared/**', 'mobile/**', 'supabase/**', '.github/workflows/app-security.yml']
  pull_request:
    paths: ['src/**', 'shared/**', 'mobile/**', 'supabase/**', '*lock.json', 'package.json', '*Dockerfile*', '*dockerignore', 'compose.yaml', 'web/Dockerfile', '.github/workflows/app-security.yml']
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fspfwidfdnqvpgmipate.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: nonsecret-build-check
      APP_ORIGIN: http://localhost:3000
      SITE_URL: https://bible-diaries.example
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose build --pull app website
      - run: docker compose up -d --wait --wait-timeout 120
      - run: |
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3001/api/health
          node scripts/check-csp.mjs http://localhost:3000
          test "$(docker compose exec -T app id -u)" != 0
          test "$(docker compose exec -T website id -u)" != 0
      - if: always()
        run: docker compose down
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: node --test web/tests/diary-settings.test.mjs web/tests/app-security.test.mjs web/tests/content-service.test.mjs
        working-directory: .
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
      - run: npm audit --omit=dev --audit-level=high
