name: bible-diaries
services:
  main:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public Supabase key}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      APP_ORIGIN: ${MAIN_SITE_URL:-http://localhost:3000}
      APP_SITE_ROLE: main
      MAIN_SITE_URL: ${MAIN_SITE_URL:-http://localhost:3000}
      APP_SITE_URL: ${APP_ORIGIN:-http://localhost:3003}
      WAITLIST_URL: ${WAITLIST_URL:-http://localhost:3001}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
    ports: ["127.0.0.1:3000:3000"]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public Supabase key}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3003}
      APP_SITE_ROLE: app
      MAIN_SITE_URL: ${MAIN_SITE_URL:-http://localhost:3000}
      APP_SITE_URL: ${APP_ORIGIN:-http://localhost:3003}
      WAITLIST_URL: ${WAITLIST_URL:-http://localhost:3001}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
    ports: ["127.0.0.1:3003:3000"]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  website:
    build:
      context: ./web
      args:
        SITE_URL: ${WAITLIST_URL:-http://localhost:3001}
    env_file:
      - path: ./web/.env.local
        required: false
    environment:
      SITE_ROLE: waitlist
      SITE_URL: ${WAITLIST_URL:-http://localhost:3001}
      MAIN_SITE_URL: ${MAIN_SITE_URL:-http://localhost:3000}
      WAITLIST_URL: ${WAITLIST_URL:-http://localhost:3001}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
    ports: ["127.0.0.1:3001:3000"]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin:
    build:
      context: ./web
      args:
        SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
    env_file:
      - path: ./web/.env.local
        required: false
    environment:
      SITE_ROLE: admin
      SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
      MAIN_SITE_URL: ${MAIN_SITE_URL:-http://localhost:3000}
      WAITLIST_URL: ${WAITLIST_URL:-http://localhost:3001}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
    ports: ["127.0.0.1:3002:3000"]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mobile-check:
    profiles: [tools]
    build:
      context: .
      dockerfile: mobile/Dockerfile
    environment:
      EXPO_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
